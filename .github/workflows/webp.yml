name: Convert uploads to WebP

# Images uploaded through the CMS land as PNG or JPG. This converts them to
# WebP, rewrites their paths in src/content/data, and commits the result.
# Commits made with GITHUB_TOKEN don't trigger workflows, so it can't loop.

on:
  push:
    branches: [main]
    paths:
      - "public/images/**"
      - "src/content/data/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Convert
        run: node scripts/webp.mjs

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain public/images src/content/data)" ]; then
            echo "Nothing to convert."
            exit 0
          fi
          git config user.name "webp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/images src/content/data
          git commit -m "Convert uploaded images to WebP"
          git pull --rebase origin main
          git push
